# Local Fixture demo only; use with compose.ci.yaml and a new owned project.
# These host ports avoid the historical T14/T15 demo listeners.
services:
  postgres:
    volumes: !override
      - portfolio-data:/var/lib/postgresql/data
    ports: !override
      - "127.0.0.1:8026:18001"
      - "127.0.0.1:5196:15174"
    mem_limit: 1g
    cpus: 1
  runner:
    image: agentmall-portfolio-demo-runner:local
    mem_limit: 2g
    cpus: 2
    volumes: !override
      - ./.playground/portfolio-demo-output:/work/.t13/outputs
volumes:
  portfolio-data:
    labels:
      agentmall.scope: local-fixture-demo
