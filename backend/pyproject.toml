[project]
name = "agentmall"
version = "0.3.0"
description = "AgentMall bounded tool-calling purchase agent"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "langchain>=1.4.7,<2",
  "langchain-deepseek>=1.1.1,<2",
  "pgvector==0.4.2",
  "jieba==0.42.1",
  "langgraph-checkpoint-postgres==3.2.0",
  "mcp==2.3.0",
]

[project.optional-dependencies]
embedding = ["torch==2.9.1", "transformers==4.57.6"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentmall"]
